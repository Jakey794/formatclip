name: Bug report
description: Report a reproducible FormatClip problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private snippets, or other sensitive data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Start the backend..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FormatClip version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Chrome, operating system, Python, and Node versions if relevant.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and private snippet text from this report.
          required: true
