[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "formatclip-backend"
version = "1.0.0"
description = "Local FastAPI formatting service for the FormatClip Chrome extension."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jacob Allan" }]
dependencies = [
    "fastapi>=0.115,<1",
    "groq>=1,<2",
    "openai>=2,<4",
    "pydantic>=2.8,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pip-audit>=2.8,<3",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/Jakey794/formatclip"
Issues = "https://github.com/Jakey794/formatclip/issues"
Source = "https://github.com/Jakey794/formatclip"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
